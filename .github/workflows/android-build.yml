name: Android Native Builds

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            clang: aarch64-linux-android

    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout UniTool-core USB broker sources
        uses: actions/checkout@v4
        with:
          repository: UniTool-Android/UniTool-core
          ref: feature/termux-runtime
          path: unitool-core

      - name: Build UniTool broker-backed libusb for Android
        shell: bash
        run: |
          set -euo pipefail
          CORE_CPP="$GITHUB_WORKSPACE/unitool-core/app/src/main/cpp"
          CORE_JNI="$GITHUB_WORKSPACE/unitool-core/app/src/main/jniLibs/arm64-v8a"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # The selected CMake targets do not use CPython; satisfy the
          # top-level imported-target existence checks without linking Python.
          mkdir -p "$CORE_CPP/python/include" "$CORE_JNI"
          : > "$CORE_CPP/python/include/Python.h"
          : > "$CORE_JNI/libpython3.14.so"
          cmake -S "$CORE_CPP" -B "$GITHUB_WORKSPACE/build/unitool-usb" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$GITHUB_WORKSPACE/build/unitool-usb" --target libusb_prebuilt usb_bridge --parallel
          BRIDGE_SO="$(find "$GITHUB_WORKSPACE/build/unitool-usb" -type f -name 'libusb_bridge.so' -print -quit)"
          test -s "$CORE_JNI/libusb.so"
          test -n "$BRIDGE_SO" && test -s "$BRIDGE_SO"
          mkdir -p "$GITHUB_WORKSPACE/build/unitool-runtime/include"
          cp "$CORE_JNI/libusb.so" "$GITHUB_WORKSPACE/build/unitool-runtime/libusb.so"
          cp "$BRIDGE_SO" "$GITHUB_WORKSPACE/build/unitool-runtime/libusb_bridge.so"
          curl -fsSL https://raw.githubusercontent.com/libusb/libusb/15a7ebb4d426c5ce196684347d2b7cafad862626/libusb/libusb.h \
            -o "$GITHUB_WORKSPACE/build/unitool-runtime/include/libusb.h"
          echo "UNITOOL_LIBUSB_DIR=$GITHUB_WORKSPACE/build/unitool-runtime" >> "$GITHUB_ENV"
          echo "UNITOOL_LIBUSB_INCLUDE_DIR=$GITHUB_WORKSPACE/build/unitool-runtime/include" >> "$GITHUB_ENV"

      - name: Install Rust nightly and Android targets
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustup target add ${{ matrix.target }} --toolchain nightly

      - name: Configure Android cross-compilers
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/${{ matrix.clang }}${ANDROID_API}-clang"
          echo "CC_${{ matrix.target }}=$TOOLCHAIN/${{ matrix.clang }}${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "AR_${{ matrix.target }}=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          TARGET_ENV=$(echo "${{ matrix.target }}" | tr "[:lower:]-" "[:upper:]_")
          echo "CARGO_TARGET_${TARGET_ENV}_LINKER=$TOOLCHAIN/${{ matrix.clang }}${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}

      - name: Build against UniTool broker-backed libusb
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          chmod +x scripts/build-android-arm64.sh
          scripts/build-android-arm64.sh
          BIN="target/${{ matrix.target }}/release/umbrage-cli"
          LIB="target/${{ matrix.target }}/release/libumbrage_cli.so"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for artifact in "$BIN" "$LIB"; do
            "$READELF" -d "$artifact" | grep -F 'Shared library: [libusb.so]'
          done
          "$READELF" -d "$UNITOOL_LIBUSB_DIR/libusb.so" | grep -F 'Shared library: [libusb_bridge.so]'

      - name: Stage Android outputs
        shell: bash
        run: |
          set -euo pipefail
          ABI="${{ matrix.abi }}"
          TARGET="${{ matrix.target }}"
          OUT="dist/android"
          mkdir -p "$OUT/jniLibs/$ABI" "$OUT/bin/$ABI" "$OUT/lib/$ABI"
          cp "$UNITOOL_LIBUSB_DIR/libusb.so" "$OUT/lib/$ABI/libusb.so"
          cp "$UNITOOL_LIBUSB_DIR/libusb_bridge.so" "$OUT/lib/$ABI/libusb_bridge.so"

          LIB="target/$TARGET/release/libumbrage_cli.so"
          BIN="target/$TARGET/release/umbrage-cli"
          test -s "$LIB"
          test -s "$BIN"

          llvm-strip --strip-unneeded "$LIB"
          llvm-strip --strip-unneeded "$BIN"

          cp "$LIB" "$OUT/jniLibs/$ABI/libumbrage_cli.so"
          cp "$BIN" "$OUT/bin/$ABI/umbrage-cli"
          chmod 0755 "$OUT/bin/$ABI/umbrage-cli"

          file "$OUT/jniLibs/$ABI/libumbrage_cli.so" "$OUT/bin/$ABI/umbrage-cli"
          llvm-readelf -h "$OUT/jniLibs/$ABI/libumbrage_cli.so" | grep -E 'Class:|Machine:'
          llvm-readelf -h "$OUT/bin/$ABI/umbrage-cli" | grep -E 'Class:|Machine:'

      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: umbrage-android-${{ matrix.abi }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Android release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: umbrage-android-*
          path: dist/android
          merge-multiple: true

      - name: Create checksums and release archives
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/android/jniLibs/arm64-v8a/libumbrage_cli.so
          test -s dist/android/bin/arm64-v8a/umbrage-cli

          find dist/android -type f -print0 | sort -z | xargs -0 sha256sum > dist/android/SHA256SUMS
          cd dist
          tar -czf umbrage-android-native.tar.gz android
          zip -qr umbrage-android-native.zip android

      - name: Upload combined Android package
        uses: actions/upload-artifact@v4
        with:
          name: umbrage-android-native
          path: |
            dist/umbrage-android-native.tar.gz
            dist/umbrage-android-native.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/umbrage-android-native.tar.gz
            dist/umbrage-android-native.zip
