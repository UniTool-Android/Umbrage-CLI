name: Android Native Builds

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docs/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docs/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build Android arm64-v8a
    runs-on: ubuntu-24.04
    env:
      ANDROID_API: "24"
      NDK_VERSION: "27.2.12479018"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup target add aarch64-linux-android --toolchain nightly

      - name: Configure NDK compiler
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: umbrage-android-arm64

      - name: Build Android library and executable
        run: cargo +nightly build --locked --release --target aarch64-linux-android --features android --lib --bins

      - name: Stage and inspect output
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/android/arm64-v8a"
          mkdir -p "$OUT"
          cp target/aarch64-linux-android/release/libumbrage_cli.so "$OUT/libumbrage_cli.so"
          cp target/aarch64-linux-android/release/umbrage-cli "$OUT/umbrage-cli"
          chmod 0755 "$OUT/umbrage-cli"
          llvm-strip --strip-unneeded "$OUT/libumbrage_cli.so"
          llvm-strip --strip-unneeded "$OUT/umbrage-cli"
          file "$OUT/libumbrage_cli.so" "$OUT/umbrage-cli"
          llvm-readelf -h "$OUT/libumbrage_cli.so" | grep -E 'Class:|Machine:'
          llvm-readelf -h "$OUT/umbrage-cli" | grep -E 'Class:|Machine:'
          sha256sum "$OUT/libumbrage_cli.so" "$OUT/umbrage-cli" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: umbrage-adbify-arm64-v8a
          path: dist/android/arm64-v8a/
          if-no-files-found: error
          retention-days: 14

  host-check:
    name: Host tests and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --locked
