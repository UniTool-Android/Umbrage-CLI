name: CI

on:
  push:
    branches:
      - main
      - feature/unitool-android-usb-broker
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests and integration-script validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev build-essential

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Validate Android build script syntax
        run: bash -n scripts/build-android-arm64.sh

      - name: Run CLI tests
        run: cargo test --release
