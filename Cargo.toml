[package]
name = "umbrage-cli"
version = "0.1.3"
edition = "2024"
description = "🌑 Headless CLI for MTK devices, with UniTool Android USB broker support"
license = "AGPL-3.0-or-later"
authors = ["DiabloSat <dev@diablosat.cc>"]
repository = "https://github.com/UniTool-Android/Umbrage-CLI"

# Deliberately standalone: this crate does not join the Qt GUI workspace.

[dependencies]
# Keep penumbra's libusb backend, but do not enable rusb's vendored libusb.
# Android builds link dynamically to UniTool-core's broker-patched libusb.so.
penumbra-mtk = { git = "https://github.com/umbrage-org/umbrage-penumbra", package = "penumbra-mtk", rev = "55fb158", default-features = false, features = ["libusb", "exploits"] }
rusb = "0.9"

clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
serde_json = "1"
log = "0.4"
env_logger = "0.11"

ureq = "=3.4.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = { version = "0.14", optional = true }
once_cell = "1"

[features]
default = []
android = ["dep:android_logger"]

[[bin]]
name = "umbrage-cli"
path = "src/main.rs"

[lib]
name = "umbrage_cli"
crate-type = ["cdylib"]
path = "src/lib.rs"
